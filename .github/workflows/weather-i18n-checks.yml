name: Weather i18n checks

on:
  push:
    branches:
      - feature/weather-location-intelligence
  pull_request:
    branches:
      - main
      - feature/weather-location-intelligence

jobs:
  frontend:
    name: Frontend localization, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build production frontend
        run: npm run build
